services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - APP_ENV=development
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Optional: point gateway to mocks for offline testing
      # - OPENAI_BASE_URL=http://mock-providers:9000
      # - ANTHROPIC_BASE_URL=http://mock-providers:9000
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  mock-providers:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "uvicorn", "src.mock_providers.main:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"
    environment:
      - APP_ENV=development

  # Optional: run Ollama inside compose (instead of host Ollama)
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama:/root/.ollama

